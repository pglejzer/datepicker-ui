<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>

    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css"
      rel="stylesheet"
    />

    <title>Datepicker-UI - Modern Date Picker Library</title>

    <script>
      if (
        localStorage.getItem("darkMode") === "true" ||
        (!localStorage.getItem("darkMode") &&
          window.matchMedia("(prefers-color-scheme: dark)").matches)
      ) {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>

  <body
    class="min-h-screen bg-gray-50 dark:bg-gray-900 transition-colors duration-300"
  >
    <header
      class="sticky top-0 z-50 bg-white/80 dark:bg-gray-900/80 backdrop-blur-lg border-b border-gray-200 dark:border-gray-700"
    >
      <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center py-4">
          <div class="flex items-center">
            <h1 class="text-2xl font-bold text-gray-900 dark:text-white">
              Datepicker-UI
            </h1>
            <span
              class="ml-2 px-2 py-0.5 text-xs font-medium bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-200 rounded-full"
            >
              v1.0.0
            </span>
          </div>

          <div class="flex items-center space-x-4">
            <button
              id="dark-mode-toggle"
              type="button"
              class="p-2 rounded-lg bg-gray-100 hover:bg-gray-200 dark:bg-gray-800 dark:hover:bg-gray-700 transition-colors"
              aria-label="Toggle dark mode"
            >
              <span
                class="material-icons text-gray-600 dark:text-gray-400 dark:hidden"
                >dark_mode</span
              >
              <span class="material-icons text-gray-400 hidden dark:block"
                >light_mode</span
              >
            </button>
            <a
              href="https://github.com/pglejzer/datepicker-ui"
              target="_blank"
              class="inline-flex items-center px-4 py-2 bg-gray-900 hover:bg-gray-800 dark:bg-gray-700 dark:hover:bg-gray-600 text-white text-sm font-medium rounded-lg transition-colors"
            >
              GitHub
            </a>
          </div>
        </div>
      </nav>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <section class="text-center mb-12">
        <h2
          class="text-4xl md:text-5xl font-bold text-gray-900 dark:text-white mb-4"
        >
          Material Design 3 Date Picker
        </h2>
        <p class="text-lg text-gray-600 dark:text-gray-300 max-w-3xl mx-auto">
          Stage 1: docked, modal and inline pickers with the basic theme (light
          and dark). Every public event lands in the log.
        </p>
      </section>

      <div class="grid lg:grid-cols-[1fr_340px] gap-8 items-start">
        <div id="demos" class="grid gap-8"></div>

        <aside
          class="lg:sticky lg:top-24 bg-white dark:bg-gray-800 rounded-2xl border border-gray-200 dark:border-gray-700 overflow-hidden"
        >
          <div
            class="flex justify-between items-center px-5 py-4 border-b border-gray-200 dark:border-gray-700"
          >
            <h3 class="font-semibold text-gray-900 dark:text-white">Events</h3>
            <button
              id="clear-log"
              type="button"
              class="text-sm text-blue-600 dark:text-blue-400 hover:underline"
            >
              Clear
            </button>
          </div>
          <ol
            id="event-log"
            class="max-h-[70vh] overflow-auto px-5 py-3 space-y-1 font-mono text-xs text-gray-700 dark:text-gray-300 break-all"
          ></ol>
        </aside>
      </div>

      <div class="h-[50vh]"></div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup.min.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        Prism.highlightAll();
      });
    </script>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
